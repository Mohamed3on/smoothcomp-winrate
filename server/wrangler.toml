name = "mat-stats"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
routes = [{ pattern = "matstats.mohamed3on.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "mat-stats-careers"
database_id = "63a2b393-f89d-4642-9ad7-e578cb2638e9"

# No cron: careers are kept however old (the stats site shows the latest read; the extension's lookups
# skip any past 30 days and read those again).
[triggers]
crons = []

# The public stats site. The Worker answers first (pages get a fresh CSP nonce), except for the built files,
# which keep site/public/_headers.
[assets]
binding = "ASSETS"
directory = "../site/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/*", "!/assets/*", "!/icon.svg"]

# Each request's errors kept a few days (Workers Logs), so a failure can be read after the fact; Issues groups failures
# (exceptions, 5xx, console.error) and alerts on them.
[observability]
enabled = true

[observability.issues]
enabled = true
